<!DOCTYPE html>
<html>
<head>
    <title>HACKNEX Emergency AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #c62828;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #8e0000;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚑 HACKNEX Emergency AI</h1>

    <p>Enter the patient's emergency request:</p>

    <textarea id="patientRequest"
        placeholder="Example: I have severe chest pain"></textarea>

    <br>

    <button onclick="sendEmergency()">
        Start Emergency Response
    </button>

    <div id="result">
        Result will appear here...
    </div>

</div>

<script>

async function sendEmergency() {

    const request =
        document.getElementById("patientRequest").value;

    if (!request) {
        alert("Please enter a patient request.");
        return;
    }

    document.getElementById("result").innerText =
        "Processing emergency request...";

    const response = await fetch("/emergency", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            patient_request: request
        })
    });

    const data = await response.json();

    document.getElementById("result").innerText =
        JSON.stringify(data, null, 2);
}

</script>

</body>
</html>
